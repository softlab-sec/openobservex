# ============================================================
# OpenTelemetry Collector - OpenObserveX ingestion front door
# Receives OTLP (logs, metrics, traces) AND scrapes infra
# metrics (node-exporter, cAdvisor), writing all to ClickHouse.
# ============================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrapes Prometheus-format infra metrics on a fixed interval.
  prometheus:
    config:
      scrape_configs:
        - job_name: node-exporter
          scrape_interval: 15s
          static_configs:
            - targets: [node-exporter:9100]
        - job_name: cadvisor
          scrape_interval: 15s
          static_configs:
            - targets: [cadvisor:8080]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    database: ${env:CLICKHOUSE_DB}
    create_schema: true
    ttl: 72h
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 10
      batch:
        flush_timeout: 5s
        min_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
